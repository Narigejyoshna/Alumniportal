<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Alumni Interactions</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family: Arial, sans-serif;
        }

        body{
            background-color:white;
            text-align:center;
        }

        h1{
            margin-top:30px;
            font-size:48px;
            font-weight:bold;
        }

        .main-image{
            margin-top:40px;
        }

        .main-image img{
            width:70%;
            max-width:900px;
        }

        .button-container{
            margin-top:40px;
            display:flex;
            justify-content:center;
            gap:30px;
            flex-wrap:wrap;
        }

        .btn{
            background:#1e90ff;
            color:white;
            padding:18px 35px;
            border:none;
            font-size:22px;
            border-radius:5px;
            cursor:pointer;
            transition:0.3s;
        }

        .btn:hover{
            background:#0066cc;
        }

    </style>
</head>

<body>

    <h1>WELCOME TO ALUMNI INTERACTIONS</h1>

    <div class="main-image">

        <!-- Replace alumni.png with your image name -->
        <img src="https://www.cecmohali.org/public/images/pages/alumni/Connectivity%20Banner01.jpg" alt="Alumni Image">

    </div>

    <div class="button-container">

        <button class="btn">Alumni Contact</button>

        <button class="btn"
        onclick="window.location.href='alumni_assist.html'">
        Alumni Assist
        </button>

        <button class="btn">Events</button>

        <button class="btn">Alumni Speaks</button>

    </div>

</body>
</html>
