<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Images with Heading</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        .heading {
            margin-bottom: 30px;
            font-size: 30px;
            color: #333;
        }
        .image-container {
            display: flex;
            gap: 35px; /* Space between images */
        }
        .image-container img {
            max-width: 32%;
            height: auto;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>
<body>
    <div class="heading"><b>Image Gallery</b></div>
    <div class="image-container">
        <img src="https://www.nisau.org.uk/images/gallery/img17.jpg" alt="Image 1">
        <img src="https://valiacollege.co.in/wp-content/uploads/2021/06/Comm-BSE.png" alt="Image 2">
        <img src="https://th.bing.com/th/id/OIP.K1cvY5aAExTpzmtJctLoqAHaES?w=308&h=180&c=7&r=0&o=5&dpr=1.3&pid=1.7" alt="Image 3">
    </div>
</body>
</html>
